version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    environment:
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma
      - FRONTEND_ORIGIN=*
    volumes:
      - backend_chroma_data:/app/data/chroma
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8502:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
volumes:
  backend_chroma_data:
